name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    # Daily refresh of mortgage and inflation rates (public/rates.json)
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Fetch current rates
        # A failed fetch must never block a deploy; the app reports missing data
        continue-on-error: true
        run: npm run fetch-rates
        env:
          PREVIOUS_RATES_URL: ${{ steps.pages.outputs.base_url }}/rates.json

      - name: Build with Next.js
        run: npm run build

      - name: Debug - List files
        run: |
          ls -la
          ls -la out || echo "out directory not found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
